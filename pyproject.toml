[project]
name = "brain-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zaytsev Artem", email = "zajtsev.artjom@samlit.net" }
]
requires-python = ">=3.10"
dependencies = [
    "albumentations>=2.0.8",
    "huggingface-hub>=0.23",
    "matplotlib>=3.5",
    "opencv-python>=4.5",
    "plotly>=5.0",
    "ruff>=0.17.1",
    "torch>=2.1",
    "torchvision>=0.16",
    "wandb>=0.17",
    "wget>=3.2",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.0",
    "pandas>=2.3.3",
    "pytest>=7.0",
    "scikit-learn>=1.7.2",
]

[project.scripts]

download_data = "brain_hackathon.data.download:main"
align_data = "brain_hackathon.data.align:main"
preview_data = "brain_hackathon.data.preview:main"
train_model = "brain_hackathon.train.main:main"
search_hparams = "brain_hackathon.train.search:main"
report_hparams = "brain_hackathon.train.report:main"
train = "brain_hackathon.train.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
